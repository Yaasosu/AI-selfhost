[project]
name = "my-llm-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "fastapi-cache2[redis]>=0.2.2",
    "fastapi-limiter>=0.2.0",
    "limits>=3.13.0",
    "ollama>=0.6.2",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.21",
    "scheme>=2.0.2",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]


[tool.ruff]
# Set the target Python version so Ruff knows which syntax is legal
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E/F: Flake8 basics | I: Import sorting | UP: Pyupgrade (modern syntax)
select = ["E", "F", "I", "UP"]

# Ignore specific rules if they annoy you (e.g., E501: line too long)
ignore = ["E501"]

# Allow auto-fix for all selected rules
fixable = ["ALL"]

[dependency-groups]
dev = [
    "fastapi-cache2>=0.2.2",
    "ollama>=0.6.2",
    "pyjwt>=2.13.0",
    "ruff>=0.15.21",
]
